<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS225 2026 — Course Calendar</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --today-tint:     rgba(42,120,214,0.10);

    --c-project: #2a78d6; /* Project + Programming Assignment */
    --c-general: #eb6834; /* General Assignment */
    --c-quiz:    #1baf7a; /* Quiz */
    --c-final:   #d03b3b; /* Final Exam */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --today-tint:     rgba(57,135,229,0.14);

      --c-project: #3987e5;
      --c-general: #d95926;
      --c-quiz:    #199e70;
      --c-final:   #d03b3b;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .page { max-width: 980px; margin: 0 auto; }
  header h1 { margin: 0 0 4px; font-size: 1.6em; }
  header .sub { color: var(--text-secondary); margin: 0 0 12px; }
  header a { color: var(--c-project); text-decoration: none; }
  header a:hover { text-decoration: underline; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    margin: 16px 0 20px;
    padding: 12px 16px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text-secondary);
  }
  .swatch {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    display: inline-block;
    flex-shrink: 0;
  }
  .swatch.ev-project { background: var(--c-project); }
  .swatch.ev-general { background: var(--c-general); }
  .swatch.ev-quiz    { background: var(--c-quiz); }
  .swatch.ev-final   { background: var(--c-final); }

  #calendar-wrap {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }

  .note { color: var(--text-muted); font-size: 13px; margin-top: 16px; }
  .note a { color: var(--c-project); }

  /* FullCalendar theming to match the palette above */
  .fc {
    --fc-border-color: var(--gridline);
    --fc-page-bg-color: var(--surface-1);
    --fc-neutral-bg-color: var(--surface-1);
    --fc-list-event-hover-bg-color: var(--gridline);
    --fc-today-bg-color: var(--today-tint);
    --fc-button-bg-color: var(--surface-1);
    --fc-button-border-color: var(--border);
    --fc-button-text-color: var(--text-primary);
    --fc-button-hover-bg-color: var(--gridline);
    --fc-button-active-bg-color: var(--c-project);
    --fc-button-active-border-color: var(--c-project);
    color: var(--text-primary);
  }
  .fc .fc-toolbar-title { color: var(--text-primary); font-size: 1.15em; }
  .fc .fc-col-header-cell-cushion,
  .fc .fc-daygrid-day-number { color: var(--text-secondary); text-decoration: none; }
  .fc .fc-daygrid-day-number { font-size: 13px; }
  .fc-event { color: #fff; border-radius: 4px; border: none; font-size: 12px; padding: 1px 4px; }
  .fc-event.ev-project { background: var(--c-project); }
  .fc-event.ev-general { background: var(--c-general); }
  .fc-event.ev-quiz    { background: var(--c-quiz); }
  .fc-event.ev-final   { background: var(--c-final); font-weight: 600; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>CS225 — Course Calendar</h1>
    <p class="sub">Neural Network Design and Training · Fall 2026</p>
    <p><a href="README.md">&larr; Back to course README</a></p>
  </header>

  <div class="legend">
    <span class="legend-item"><span class="swatch ev-project"></span>Project + Programming Assignment</span>
    <span class="legend-item"><span class="swatch ev-general"></span>General Assignment</span>
    <span class="legend-item"><span class="swatch ev-quiz"></span>Quiz</span>
    <span class="legend-item"><span class="swatch ev-final"></span>Final Exam</span>
  </div>

  <div id="calendar-wrap">
    <div id="calendar"></div>
  </div>

  <p class="note">All dates are also listed as a table in the <a href="README.md">README</a>.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script>
  const events = [
    // Project + Programming Assignment (announced together; single submission deadline)
    { title: 'Project 1 + PA 1', start: '2026-08-30', end: '2026-09-07', className: 'ev-project' },
    { title: 'Project 2 + PA 2', start: '2026-09-13', end: '2026-09-21', className: 'ev-project' },
    { title: 'Project 3 + PA 3', start: '2026-09-27', end: '2026-10-05', className: 'ev-project' },
    { title: 'Project 4 + PA 4', start: '2026-10-11', end: '2026-10-22', className: 'ev-project' },
    { title: 'Project 5 + PA 5', start: '2026-10-25', end: '2026-11-02', className: 'ev-project' },
    { title: 'Project 6 + PA 6', start: '2026-11-04', end: '2026-11-12', className: 'ev-project' },
    { title: 'Project 7 + PA 7', start: '2026-11-15', end: '2026-11-23', className: 'ev-project' },
    { title: 'Project 8 + PA 8', start: '2026-11-25', end: '2026-12-03', className: 'ev-project' },

    // General Assignments (course-review content)
    { title: 'General Assignment 1', start: '2026-09-02', end: '2026-09-10', className: 'ev-general' },
    { title: 'General Assignment 2', start: '2026-09-16', end: '2026-09-28', className: 'ev-general' },
    { title: 'General Assignment 3', start: '2026-09-30', end: '2026-10-08', className: 'ev-general' },
    { title: 'General Assignment 4', start: '2026-10-14', end: '2026-10-26', className: 'ev-general' },
    { title: 'General Assignment 5', start: '2026-10-28', end: '2026-11-05', className: 'ev-general' },
    { title: 'General Assignment 6', start: '2026-11-08', end: '2026-11-16', className: 'ev-general' },
    { title: 'General Assignment 7', start: '2026-11-18', end: '2026-11-26', className: 'ev-general' },
    { title: 'General Assignment 8', start: '2026-11-29', end: '2026-12-07', className: 'ev-general' },

    // Quizzes (each covers two Projects)
    { title: 'Quiz 1 (Projects 1-2)', start: '2026-09-30', className: 'ev-quiz' },
    { title: 'Quiz 2 (Projects 3-4)', start: '2026-10-28', className: 'ev-quiz' },
    { title: 'Quiz 3 (Projects 5-6)', start: '2026-11-18', className: 'ev-quiz' },
    { title: 'Quiz 4 (Projects 7-8)', start: '2026-12-09', className: 'ev-quiz' },

    // Final Exam
    { title: 'Final Exam, 4:30 p.m.', start: '2026-12-15T16:30:00', className: 'ev-final' },
  ];

  document.addEventListener('DOMContentLoaded', function () {
    const calendarEl = document.getElementById('calendar');
    const calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      initialDate: '2026-08-30',
      firstDay: 0,
      height: 'auto',
      dayMaxEvents: true,
      navLinks: true,
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,listMonth',
      },
      events: events,
      eventDidMount: function (info) {
        info.el.setAttribute('title', info.event.title);
      },
    });
    calendar.render();
  });
</script>
</body>
</html>
